<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1620" width="1500" height="1620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="0" y="0" width="1500" height="1700" fill="#FAF8F3"/><text x="60" y="70" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#000" letter-spacing="1">DHARANA  —  LOGO CONCEPTS</text><rect x="60" y="100" width="420" height="420" fill="#FAF8F3"/><rect x="60" y="100" width="420" height="420" fill="none" stroke="#e4e0d6"/><g transform="translate(170,170) scale(2.0)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g><text x="80" y="490" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#000" letter-spacing="1">01  SETTLING</text><text x="80" y="545" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#000" letter-spacing="1"></text><rect x="530" y="100" width="420" height="420" fill="#FAF8F3"/><rect x="530" y="100" width="420" height="420" fill="none" stroke="#e4e0d6"/><g transform="translate(640,170) scale(2.0)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M39,36 a11,11 0 0,1 22,0 v28 a11,11 0 0,1 -22,0Z"/><circle cx="50" cy="50" r="6" fill="#000000"/></g><text x="550" y="490" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#000" letter-spacing="1">02  THRESHOLD</text><text x="550" y="545" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#000" letter-spacing="1"></text><rect x="1000" y="100" width="420" height="420" fill="#FAF8F3"/><rect x="1000" y="100" width="420" height="420" fill="none" stroke="#e4e0d6"/><g transform="translate(1110,170) scale(2.0)"><rect x="12.0" y="16" width="76" height="10" rx="5" fill="#000000"/><rect x="25.0" y="32" width="50" height="10" rx="5" fill="#000000"/><rect x="38.0" y="48" width="24" height="10" rx="5" fill="#000000"/><circle cx="50" cy="76" r="9" fill="#000000"/></g><text x="1020" y="490" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#000" letter-spacing="1">03  NARROWING</text><text x="1020" y="545" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#000" letter-spacing="1"></text><text x="80" y="560" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">A ring whose weight gathers above while a single</text><text x="80" y="582" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">point rests low — attention settling to one place.</text><text x="80" y="604" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">The off-centre void is the quiet tension.</text><text x="550" y="560" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">A disc with a narrow vertical opening and a point</text><text x="550" y="582" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">held inside it — attention narrowed to a single slit</text><text x="550" y="604" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">of presence.</text><text x="1020" y="560" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">Three bars shorten step by step toward a point — the</text><text x="1020" y="582" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">field of attention narrowing until only one thing</text><text x="1020" y="604" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#6b675f" letter-spacing="1">remains.</text><text x="60" y="690" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#000" letter-spacing="1">RECOMMENDED  —  01 SETTLING</text><rect x="60" y="720" width="430" height="430" fill="#F4F1EA"/><rect x="490" y="720" width="430" height="430" fill="#000000"/><g transform="translate(175,835) scale(2.0)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g><g transform="translate(605,835) scale(2.0)"><path fill="#F4F1EA" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#F4F1EA"/></g><g transform="translate(960,720) scale(0.4199)"><rect width="1024" height="1024" rx="230" fill="#000000"/><g transform="translate(512,512) scale(7.2) translate(-50,-50)"><path fill="#F4F1EA" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#F4F1EA"/></g></g><g transform="translate(960,1160) scale(0.4199)"><rect width="1024" height="1024" rx="230" fill="#F4F1EA" stroke="#d8d3c6" stroke-width="3"/><g transform="translate(512,512) scale(7.2) translate(-50,-50)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g></g><text x="960" y="1160" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8a867d" letter-spacing="1">APP ICON (system applies its own mask)</text><rect x="60" y="1180" width="430" height="200" fill="#F4F1EA"/><rect x="490" y="1180" width="430" height="200" fill="#000000"/><g transform="translate(90,1235) scale(0.9)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g><text x="185" y="1295" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="300" letter-spacing="5.76" fill="#000000">Dharana</text><g transform="translate(520,1235) scale(0.9)"><path fill="#F4F1EA" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#F4F1EA"/></g><text x="615" y="1295" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="300" letter-spacing="5.76" fill="#F4F1EA">Dharana</text><text x="60" y="1415" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#000" letter-spacing="1">SMALL SIZES  —  24 / 32 / 40 / 60 px</text><rect x="60" y="1430" width="860" height="130" fill="#F4F1EA"/><g transform="translate(90,1480) scale(0.24)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g><g transform="translate(154,1480) scale(0.32)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g><g transform="translate(226,1480) scale(0.4)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0Z M26,55 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0Z"/><circle cx="50" cy="55" r="8" fill="#000000"/></g><g transform="translate(306,1480) scale(0.6)"><path fill="#000000" fill-rule="evenodd" d="M10,50 a40,40 0 1,0 80,