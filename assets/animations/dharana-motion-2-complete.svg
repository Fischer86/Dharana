<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>dharana-motion-2-complete</title><style>.bg{fill:#F4F1EA}.ink{fill:#000}
@media (prefers-color-scheme:dark){.bg{fill:#000}.ink{fill:#F4F1EA}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
.a{transform-box:view-box}
.disc{transform-origin:50px 50px}.void{transform-origin:50px 55px}.dot{transform-origin:50px 55px}
.void{animation:v 5s ease-in-out infinite}.dot{animation:p 5s ease-in-out infinite}
@keyframes v{0%,12%{transform:scale(1)}26%{transform:scale(1.07)}50%,100%{transform:scale(1)}}
@keyframes p{0%,12%{transform:translateY(0)}26%{transform:translateY(-5px)}52%,100%{transform:translateY(0)}}</style><rect class="bg" width="100" height="100"/><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle class="a void" cx="50" cy="55" r="24" fill="#000"/></mask><circle class="a ink disc" cx="50" cy="50" r="40" mask="url(#m)"/><circle class="a ink dot" cx="50" cy="55" r="8"/></svg>