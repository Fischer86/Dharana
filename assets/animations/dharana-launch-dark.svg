<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>dharana-launch-dark</title>
<style>
.veil{animation:v 5s cubic-bezier(.22,.8,.24,1) infinite}
.ring{transform-origin:50px 50px;animation:ro 5s cubic-bezier(.22,.8,.24,1) infinite,rs 5s cubic-bezier(.22,.8,.24,1) infinite}
.dotc{transform-origin:50px 55px;animation:do 5s cubic-bezier(.22,.8,.24,1) infinite,ds 5s cubic-bezier(.22,.8,.24,1) infinite}
@keyframes v{0%,64%{opacity:1}74%,100%{opacity:0}}
@keyframes ro{0%,18%{opacity:0}32%,100%{opacity:1}}
@keyframes rs{0%,18%{transform:scale(1.35)}42%,100%{transform:scale(1)}}
@keyframes do{0%,8%{opacity:0}18%,100%{opacity:1}}
@keyframes ds{0%,8%{transform:translateY(-5px) scale(.6)}18%,42%{transform:translateY(-5px) scale(1)}58%,100%{transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){.veil,.ring,.dotc{animation:none}}
</style>
<rect width="390" height="844" fill="#000000"/>
<g class="veil"><svg x="125" y="352" width="140" height="140" viewBox="0 0 100 100" overflow="visible">
<mask id="m" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200"><rect x="-50" y="-50" width="200" height="200" fill="#fff"/><circle cx="50" cy="55" r="24" fill="#000"/></mask>
<g class="ring"><circle cx="50" cy="50" r="40" fill="#F4F1EA" mask="url(#m)"/></g>
<circle class="dotc" cx="50" cy="55" r="8" fill="#F4F1EA"/>
</svg></g></svg>