<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>dharana-motion-4-threshold-open</title><style>.bg{fill:#F4F1EA}.ink{fill:#000}
@media (prefers-color-scheme:dark){.bg{fill:#000}.ink{fill:#F4F1EA}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
.a{transform-box:view-box}
.disc,.void,.dot{transform-origin:50px 50px}
.disc{animation:d 6s cubic-bezier(.22,.8,.24,1) infinite}.void{animation:v 6s cubic-bezier(.22,.8,.24,1) infinite}.dot{animation:p 6s cubic-bezier(.22,.8,.24,1) infinite}
@keyframes d{0%{opacity:0}12%,90%{opacity:1}96%,100%{opacity:0}}
@keyframes v{0%,10%{transform:scaleY(0)}34%,100%{transform:scaleY(1)}}
@keyframes p{0%,30%{opacity:0;transform:scale(0)}48%,90%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}</style><rect class="bg" width="100" height="100"/><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><rect class="a void" x="39" y="25" width="22" height="50" rx="11" fill="#000"/></mask><circle class="a ink disc" cx="50" cy="50" r="40" mask="url(#m)"/><circle class="a ink dot" cx="50" cy="50" r="6"/></svg>